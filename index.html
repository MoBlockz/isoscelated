<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isoscelated</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Isoscelated">
<meta name="theme-color" content="#1b1726">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #08060e; overflow: hidden; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #screen { display: block; position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #askbar { display: none; position: fixed; left: 50%; transform: translateX(-50%); top: 8px; width: min(94vw, 640px); box-sizing: border-box; gap: 8px; align-items: center;
    background: #fbf8f2; border: 4px solid #1b1726; box-shadow: 0 0 0 3px #a79fb3 inset; padding: 8px 10px; font-family: 'Press Start 2P', monospace; z-index: 10; }
  #asklbl { font-size: 11px; color: #2c3f8f; white-space: nowrap; }
  #askin { flex: 1; min-width: 0; font-family: 'Press Start 2P', monospace; font-size: 14px; padding: 8px; border: 3px solid #1b1726; background: #fff; color: #1b1726; outline: none; -webkit-user-select: text; user-select: text; border-radius: 0; }
  #askbar button { font-family: 'Press Start 2P', monospace; font-size: 11px; padding: 9px 10px; border: 3px solid #1b1726; background: #f6cf57; color: #1b1726; cursor: pointer; border-radius: 0; }
  #askx { background: #f08bbf !important; }
  #noscript { color: #fff; font-family: sans-serif; padding: 20px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="askbar"><span id="asklbl">SAY:</span><input id="askin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"><button id="askok">OK</button><button id="askx">X</button></div>
<noscript><div id="noscript">Isoscelated needs JavaScript turned on.</div></noscript>
<!-- PeerJS (WebRTC) for playing with friends: the host's browser runs the game -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/version.js?v=2026.11.23-2219"></script>
<script src="js/filter.js?v=2026.11.23-2219"></script>
<script src="js/audio.js?v=2026.11.23-2219"></script>
<script src="js/gfx.js?v=2026.11.23-2219"></script>
<script src="js/world.js?v=2026.11.23-2219"></script>
<script src="js/relay.js?v=2026.11.23-2219"></script>
<script src="js/net.js?v=2026.11.23-2219"></script>
<script src="js/server.js?v=2026.11.23-2219"></script>
<script src="js/ui.js?v=2026.11.23-2219"></script>
<script src="js/tasks.js?v=2026.11.23-2219"></script>
<script src="js/map-tasks.js?v=2026.11.23-2219"></script>
<script src="js/client.js?v=2026.11.23-2219"></script>
<script src="js/main.js?v=2026.11.23-2219"></script>
</body>
</html>
